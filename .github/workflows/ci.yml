name: ErnosDecent CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Ernos Compiler
        run: |
          git clone https://github.com/MettaMazza/Ernos-Programming-Language.git /tmp/ernos-compiler
          git -C /tmp/ernos-compiler checkout 4b3ebd1359886999b4f043a4663b9470ee8d474c
          cargo build --locked --release --manifest-path /tmp/ernos-compiler/Cargo.toml
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/ernos-compiler/target/release/ernos "$HOME/.local/bin/ernos"
          cp -R /tmp/ernos-compiler/stdlib "$HOME/.local/bin/stdlib"
          ln -s "$HOME/.local/bin/stdlib" stdlib
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ernos" --version
          "$HOME/.local/bin/ernos" --check node.ep

      - name: Install libsodium
        run: brew install libsodium secp256k1 cmake

      - name: Build required image runtime
        run: |
          git clone --recursive https://github.com/leejet/stable-diffusion.cpp.git /tmp/stable-diffusion.cpp
          git -C /tmp/stable-diffusion.cpp checkout bb84971129d2a094ab8051c6feed5406d3b4409d
          git -C /tmp/stable-diffusion.cpp submodule update --init --recursive
          cmake -S /tmp/stable-diffusion.cpp -B /tmp/stable-diffusion.cpp/build \
            -DCMAKE_BUILD_TYPE=Release -DSD_BUILD_SHARED_LIBS=ON \
            -DSD_BUILD_EXAMPLES=OFF -DSD_WEBP=OFF -DSD_WEBM=OFF -DSD_METAL=ON
          cmake --build /tmp/stable-diffusion.cpp/build --config Release --parallel 3
          mkdir -p "$HOME/.ernosdecent/lib"
          cp /tmp/stable-diffusion.cpp/build/bin/libstable-diffusion.dylib "$HOME/.ernosdecent/lib/"

      # ---- Compile Phase ----

      - name: Compile node daemon
        run: bash build.sh

      - name: Compile all subsystem test suites
        run: |
          set -e
          for test_file in \
            decent_id/test_keys.ep \
            decent_id/test_did.ep \
            decent_id/test_auth.ep \
            decent_net/test_dht.ep \
            decent_net/test_noise.ep \
            decent_net/test_relay.ep \
            decent_net/test_transport.ep \
            decent_net/test_noise_transport.ep \
            decent_net/test_dht_transport.ep \
            decent_net/test_relay_transport.ep \
            decent_consensus/test_consensus.ep \
            decent_msg/test_message.ep \
            decent_msg/test_channel.ep \
            decent_store/test_content.ep \
            decent_store/test_crdt.ep \
            decent_money/test_money.ep \
            decent_media/test_media.ep \
            decent_social/test_social.ep \
            decent_ai/test_ai.ep \
            decent_anon/test_anon_search.ep \
            decent_pool/test_pool.ep \
            decent_host/test_host.ep; do
              echo "=== Compiling $test_file ==="
              bash scripts/compile_ep.sh "$test_file"
          done

      - name: Compile integration and E2E tests
        run: |
          set -e
          bash scripts/compile_ep.sh test_e2e.ep
          bash scripts/compile_ep.sh test_multinode.ep
          bash scripts/compile_ep.sh test_networking.ep
          bash scripts/compile_ep.sh test_persistence.ep
          bash scripts/compile_ep.sh test_security.ep
          bash scripts/compile_ep.sh test_stress.ep
          bash scripts/compile_ep.sh test_platform.ep
          bash scripts/compile_ep.sh test_raft_tcp.ep
          bash scripts/compile_ep.sh decent_cli/test_cli.ep

      # ---- Run Phase ----

      - name: Run all subsystem test suites
        run: |
          PASS=0
          FAIL=0
          for test_bin in \
            decent_id/test_keys \
            decent_id/test_did \
            decent_id/test_auth \
            decent_net/test_dht \
            decent_net/test_noise \
            decent_net/test_relay \
            decent_net/test_transport \
            decent_net/test_noise_transport \
            decent_net/test_dht_transport \
            decent_net/test_relay_transport \
            decent_consensus/test_consensus \
            decent_msg/test_message \
            decent_msg/test_channel \
            decent_store/test_content \
            decent_store/test_crdt \
            decent_money/test_money \
            decent_media/test_media \
            decent_social/test_social \
            decent_ai/test_ai \
            decent_anon/test_anon_search \
            decent_pool/test_pool \
            decent_host/test_host; do
              echo ""
              echo "=== Running $test_bin ==="
              if OUTPUT=$(python3 scripts/run_with_timeout.py 120 "./$test_bin" 2>&1); then
                BIN_FAILED=0
              else
                BIN_FAILED=1
              fi
              echo "$OUTPUT"
              P=$(echo "$OUTPUT" | grep -c "PASS" || true)
              F=$(echo "$OUTPUT" | grep -c "FAIL:" || true)
              PASS=$((PASS + P))
              FAIL=$((FAIL + F + BIN_FAILED))
          done
          echo ""
          echo "=== SUBSYSTEM TOTAL: $PASS passed, $FAIL failed ==="
          if [ "$FAIL" -gt 0 ]; then
            exit 1
          fi

      - name: Run E2E journey tests
        run: |
          bash scripts/run_test_checked.sh 60 ./test_e2e 2>&1
          echo "E2E: OK"

      - name: Run multi-node integration tests
        run: |
          bash scripts/run_test_checked.sh 60 ./test_multinode 2>&1
          echo "Multi-node: OK"

      - name: Run networking tests
        run: |
          bash scripts/run_test_checked.sh 60 ./test_networking 2>&1
          echo "Networking: OK"

      - name: Run persistence tests
        run: |
          bash scripts/run_test_checked.sh 60 ./test_persistence 2>&1
          echo "Persistence: OK"

      - name: Run security tests
        run: |
          bash scripts/run_test_checked.sh 60 ./test_security 2>&1
          echo "Security: OK"

      - name: Run CLI integration test
        run: |
          bash scripts/run_test_checked.sh 60 decent_cli/test_cli 2>&1
          echo "CLI: OK"

      - name: Run platform detection test
        run: |
          ./test_platform 2>&1 | tee /dev/stderr | grep -q "PASS"

      - name: Run Raft consensus tests (TCP)
        run: |
          bash scripts/run_test_checked.sh 60 ./test_raft_tcp 2>&1

      - name: Run stress tests
        run: |
          bash scripts/run_test_checked.sh 120 ./test_stress 2>&1

      # ---- Verify Web UI Assets ----

      - name: Verify web UI files exist
        run: |
          set -e
          test -f decent_web/index.html
          test -f decent_web/app.js
          test -f decent_web/style.css
          echo "Web UI assets: OK"

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Ernos Compiler
        run: |
          git clone https://github.com/MettaMazza/Ernos-Programming-Language.git /tmp/ernos-compiler
          git -C /tmp/ernos-compiler checkout 4b3ebd1359886999b4f043a4663b9470ee8d474c
          cargo build --locked --release --manifest-path /tmp/ernos-compiler/Cargo.toml
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/ernos-compiler/target/release/ernos "$HOME/.local/bin/ernos"
          cp -R /tmp/ernos-compiler/stdlib "$HOME/.local/bin/stdlib"
          ln -s "$HOME/.local/bin/stdlib" stdlib
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ernos" --version
          "$HOME/.local/bin/ernos" --check node.ep

      - name: Install libsodium
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libsecp256k1-dev libssl-dev libsqlite3-dev cmake ninja-build

      - name: Build required image runtime
        run: |
          git clone --recursive https://github.com/leejet/stable-diffusion.cpp.git /tmp/stable-diffusion.cpp
          git -C /tmp/stable-diffusion.cpp checkout bb84971129d2a094ab8051c6feed5406d3b4409d
          git -C /tmp/stable-diffusion.cpp submodule update --init --recursive
          cmake -S /tmp/stable-diffusion.cpp -B /tmp/stable-diffusion.cpp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSD_BUILD_SHARED_LIBS=ON \
            -DSD_BUILD_EXAMPLES=OFF -DSD_WEBP=OFF -DSD_WEBM=OFF
          cmake --build /tmp/stable-diffusion.cpp/build --parallel 3
          mkdir -p "$HOME/.ernosdecent/lib"
          cp /tmp/stable-diffusion.cpp/build/bin/libstable-diffusion.so "$HOME/.ernosdecent/lib/"

