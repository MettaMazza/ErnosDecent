              echo "$OUTPUT"
              P=$(echo "$OUTPUT" | grep -c "PASS" || true)
              F=$(echo "$OUTPUT" | grep -c "FAIL:" || true)
              PASS=$((PASS + P))
              FAIL=$((FAIL + F))
          done
          echo ""
          echo "=== SUBSYSTEM TOTAL: $PASS passed, $FAIL failed ==="
          if [ "$FAIL" -gt 0 ]; then
